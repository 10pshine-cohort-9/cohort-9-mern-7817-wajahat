# ==========================================
# Project Identification
# ==========================================
sonar.projectKey=Notes-app
sonar.projectName=Notes-app
sonar.projectVersion=1.0

# ==========================================
# SonarQube Server
# ==========================================
sonar.host.url=http://localhost:9000

# Use ONLY ONE authentication method.
# If you are using SONAR_TOKEN in your .env, REMOVE the line below.
# Otherwise uncomment it and replace with your token.
# sonar.token=sqp_your_token_here

# ==========================================
# Source & Test Directories
# ==========================================
sonar.sources=src
sonar.tests=src/tests

sonar.sourceEncoding=UTF-8

# ==========================================
# Jest Coverage
# ==========================================
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ==========================================
# Test File Patterns
# ==========================================
sonar.test.inclusions=src/tests/**/*.test.js,src/tests/**/*.spec.js

# ==========================================
# Coverage Exclusions
# ==========================================
sonar.coverage.exclusions=src/server.js,src/app.js

# ==========================================
# Duplication Exclusions
# ==========================================
sonar.cpd.exclusions=src/tests/**

# ==========================================
# General Exclusions
# ==========================================
sonar.exclusions=node_modules/**,coverage/**,generated/**,prisma/migrations/**,prisma/generated/**