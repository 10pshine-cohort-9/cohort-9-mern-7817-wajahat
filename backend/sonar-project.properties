# ==========================================
# Project Identification
# ==========================================
sonar.projectKey=Notes-app
sonar.projectName=Notes-app
sonar.projectVersion=1.0

# ==========================================
# Source & Test Code Directories
# ==========================================
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# ==========================================
# Test Coverage & Inclusion Settings
# ==========================================
# Location of the LCOV coverage report generated by Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Include these specific files when analyzing test code
sonar.test.inclusions=tests/**/*.test.js,tests/**/*.spec.js

# Exclude setup/entry files from coverage calculation
sonar.coverage.exclusions=src/server.js,src/app.js

# Exclude tests from Copy/Paste (Duplication) detection
sonar.cpd.exclusions=tests/**

# ==========================================
# General File Exclusions
# ==========================================
# Exclude third-party dependencies, generated code, and DB migrations
sonar.exclusions=node_modules/**,coverage/**,generated/**,prisma/migrations/**,prisma/generated/**